version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: clinical-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clinical_db
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: clinic_password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: